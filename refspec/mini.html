<!-- Minimal reference: date + DOI on one line, title on the next (compact
     sidebar lists). The date and title are wrapped in spans so the CSS can
     lay them out like the writings `.post-date` / `.article-link` pair. -->

<!-- Article -->
<p id="bi-article">
  <span class="ref-date">{{year}}</span><span class="ref-sep">•</span><span class="ref-title">{{title}}</span>
</p>

<!-- Book -->
<p id="bi-book">
  <span class="ref-date">{{year}}</span><span class="ref-sep">•</span><span class="ref-title">{{title}}</span>
</p>

<p id="bi-booklet">
