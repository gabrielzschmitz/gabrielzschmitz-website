# Zola configuration for gabrielzschmitz.xyz
# One site builds both the portfolio (site root) and the blog (under /blog/).

base_url = "https://www.gabrielzschmitz.xyz/"
title = "gabrielzschmitz"
default_language = "en"
generate_feeds = true
feed_filenames = ["rss.xml"]
build_search_index = false
minify_html = true

taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
# Typographic punctuation: `--` -> en dash, `---` -> em dash, curly quotes,
# `...` -> ellipsis.
smart_punctuation = true

# Language-aware syntax highlighting, colors emitted inline (no extra CSS
# file).
[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
# Author info surfaced in the templates.
author = "gabrielzschmitz"
