{% extends "base.html" %}

{% block title %}Art · {{ config.title }}{% endblock title %}

{% block description %}{{ config.description }}{% endblock description %}

{% block content %}
  <!-- ART GALLERY BANNER -->
  {{ <gsz.archive_banner code='PINACOTHECA — <span id="roman-year"></span>' title_en="Art Gallery" title_pt="Galeria de Arte" desc_en="Works ordered by chronology. Select a piece to open its record." desc_pt="Obras ordenadas por cronologia. Selecione uma obra para abrir seu registro." /> }}

  <!-- MASONRY OF ARTWORKS -->
  <main class="art-masonry">
    {% for page in section.pages %}
      <figure class="art-figure{% if page.extra.wide %} art-figure--wide{% endif %}">
        <a class="art-link" href="{{ page.path | safe }}">
          <img class="art-img" src="{{ page.extra.image | safe }}" alt="{{ page.title }}">
        </a>
        <figcaption class="art-caption">
          <span>{{ page.title }}</span>
        </figcaption>
      </figure>
    {% else %}
      <p class="art-empty" data-en="No works in the gallery yet."
        data-pt="Ainda não há obras na galeria.">No works in the gallery yet.</p>
    {% endfor %}
  </main>

  <script src="/js/art.js" defer></script>
{% endblock content %}
