{% extends "base.html" %}

{% block title %}{{ taxonomy.name }} · {{ config.title }}{% endblock title %}

{% block content %}
  <h1 data-en="Tags" data-pt="Categorias">Tags</h1>
  <ul class="taxonomy-list">
    {% for term in terms %}
      <li class="taxonomy-item">
        <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
        <span class="taxonomy-count">({{ term.pages | length }})</span>
      </li>
    {% endfor %}
  </ul>
{% endblock content %}
