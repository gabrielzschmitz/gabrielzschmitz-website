<!-- THEME (applied before first paint so the flag filter matches the saved theme) -->
<script>
  (function () {
    var theme = localStorage.getItem('newspaper-theme')
      || localStorage.getItem('theme')
      || 'light';
    if (theme === 'dark') {
      document.documentElement.classList.add('dark-mode');
      if (document.body) document.body.classList.add('dark-mode');
    }
  })();
</script>
