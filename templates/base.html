<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{{ config.description }}">
    <link rel="icon" href="{{ get_url(path='blog/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ get_url(path='blog/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ get_url(path='blog/favicon-16x16.png') }}">
    <link rel="stylesheet" href="{{ get_url(path='blog/blog.css') }}">
    {% if config.generate_feed %}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='blog/rss.xml', trailing_slash=false) }}">
    {% endif %}

    <!-- FONTS -->
    <link rel="stylesheet" href="{{ get_url(path='fonts/fonts.css') }}">

    <!-- THEME (follows the portfolio's persisted newspaper-theme preference) -->
    <script>
      (function () {
        var theme = localStorage.getItem('newspaper-theme')
          || localStorage.getItem('theme')
          || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark-mode');
          if (document.body) document.body.classList.add('dark-mode');
        }
      })();
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
          ignoreHtmlClass: "tex2jax_ignore"
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
  </head>
  <body>
    <div class="blog-controls">
      {% if page and "posts" in page.components %}
      <div class="mode-seal" id="BackToTop" title="Back to top" hidden>
        <span class="seal-icon">🢁</span>
      </div>
      {% endif %}
      <div class="mode-seal" id="ModeToggle" title="Change theme">
        <span class="seal-icon">✦</span>
      </div>
    </div>
    <div class="newspaper-wrapper">
      <header class="site-header">
        <nav class="site-nav">
          <a class="site-title" href="{{ get_url(path='/blog/') }}">Archivum <span class="seal-key">🗝︎</span></a>
          <span class="nav-links">
            <a href="/">Home</a>
            <span class="nav-sep">♦</span>
            <a href="{{ get_url(path='/blog/about/') }}">About</a>
            <span class="nav-sep">♦</span>
            <a href="{{ get_url(path='/tags/') }}">Tags</a>
          </span>
        </nav>
      </header>

      <main class="site-main">
        {% block content %}{% endblock content %}
      </main>

      <footer class="site-footer">
        <p>
        © <span id="roman-year"></span> — <a href="{{
          get_url(path='blog/rss.xml', trailing_slash=false) }}">Scriptorium de
          Gabriel.</a>
        </p>
      </footer>
    </div>

    <script>
      const toRoman = (num) => {
        const values = [
          [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'],
          [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'],
          [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']
        ];

        return values.reduce((result, [value, numeral]) => {
          while (num >= value) {
            result += numeral;
            num -= value;
          }
          return result;
        }, '');
      };

      document.getElementById('roman-year').textContent =
        toRoman(new Date().getFullYear());
    </script>
    <script>
      function getCSSVar(name) {
        return getComputedStyle(document.body).getPropertyValue(name).trim();
      }

      function swordCursor(color) {
        const hex = color.replace('#', '');
        return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g transform='rotate(90 20 20)'><text x='20' y='20' font-size='28' font-family='Lora, Georgia, serif' fill='%23${hex}' text-anchor='middle' dominant-baseline='central'>🗡</text></g></svg>") 2 2, pointer`;
      }

      function applySwordCursor() {
        const pen = swordCursor(getCSSVar('--burgundy-hover'));
        ['a', 'button', '#ModeToggle', '#BackToTop'].forEach(sel => {
          document.querySelectorAll(sel).forEach(el => {
            el.style.cursor = pen;
          });
        });
        document.body.style.cursor = pen;
      }
    </script>
    <script>
      (function () {
        var body = document.body;
        var docEl = document.documentElement;
        var btn = document.getElementById('ModeToggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var dark = !body.classList.contains('dark-mode');
          body.classList.toggle('dark-mode', dark);
          docEl.classList.toggle('dark-mode', dark);
          localStorage.setItem('newspaper-theme', dark ? 'dark' : 'light');
          if (window.applySwordCursor) window.applySwordCursor();
        });
      })();
    </script>
    <script>
      (function () {
        if (window.applySwordCursor) window.applySwordCursor();
      })();
    </script>
    <script>
      (function () {
        var topBtn = document.getElementById('BackToTop');
        if (!topBtn) return;
        topBtn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        var THRESHOLD = 1000;
        function toggle() {
          topBtn.hidden = (window.scrollY || document.documentElement.scrollTop) < THRESHOLD;
        }
        toggle();
        window.addEventListener('scroll', toggle, { passive: true });
      })();
    </script>
  </body>
</html>
