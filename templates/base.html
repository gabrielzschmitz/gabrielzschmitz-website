<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <link rel="icon" type="image/svg+xml" href="/assets/images/GZS.svg">
    <link rel="icon" type="image/x-icon" href="/assets/images/GZS.ico">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/controls.css">
    <link rel="stylesheet" href="/css/emblem.css">
    <link rel="stylesheet" href="/css/cards.css">
    <link rel="stylesheet" href="/css/prose.css">
    <link rel="stylesheet" href="/css/archive-banner.css">
    <link rel="stylesheet" href="/css/seal-box.css">
    <link rel="stylesheet" href="/css/references.css">
    <link rel="stylesheet" href="/css/blog.css">
    {% if config.generate_feeds %}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="/blog/rss.xml">
    {% endif %}

    <!-- FONTS (loaded async so they never block initial render; glyphs preloaded where needed) -->
    <link rel="preload" href="/fonts/fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/fonts/fonts.css"></noscript>

    <!-- VERCEL ANALYTICS -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- THEME (follows the portfolio's persisted newspaper-theme preference) -->
    <script>
      (function () {
        var theme = localStorage.getItem('newspaper-theme')
          || localStorage.getItem('theme')
          || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark-mode');
          if (document.body) document.body.classList.add('dark-mode');
        }
      })();
    </script>
    {% block mathjax %}{% endblock mathjax %}
    </head>
  <body>
    <div class="floating-controls">
      {% if page and "posts" in page.components %}
      <div class="seal-button" id="back-to-top" title="Back to top" hidden>
        <span class="seal-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2L4.5 6.5h2.5v7h2v-7h2.5L8 2z" fill="currentColor"/></svg></span>
      </div>
      {% endif %}
      <div class="seal-button" id="language-toggle" title="Switch language">
        <svg class="flag-icon" id="language-flag" viewBox="0 0 30 20" width="27" height="18" aria-hidden="true">
          <rect width="30" height="20" fill="#009c3b"></rect>
          <polygon points="15,1 29,10 15,19 1,10" fill="#ffdf00"></polygon>
          <circle cx="15" cy="10" r="6.5" fill="#002776"></circle>
          <path d="M8.8 9 Q15 11.6 21.2 9 L21.2 11.6 Q15 14.2 8.8 11.6 Z" fill="#fff"></path>
          <circle cx="10" cy="7.6" r="0.6" fill="#fff"></circle>
          <circle cx="20" cy="7.6" r="0.6" fill="#fff"></circle>
          <circle cx="13" cy="5.9" r="0.6" fill="#fff"></circle>
          <circle cx="17" cy="13.5" r="0.6" fill="#fff"></circle>
          <circle cx="14.5" cy="14.5" r="0.6" fill="#fff"></circle>
        </svg>
      </div>
      <div class="seal-button" id="theme-toggle" title="Change theme">
        <span class="seal-icon">✦</span>
      </div>
    </div>
    <div class="site-frame">
      <header class="site-header">
        <nav class="site-nav">
          <a class="site-title" href="/blog/">Archivum <span class="seal-key">🗝︎</span></a>
          <span class="nav-links">
            <a href="/" data-en="Home" data-pt="Início">Home</a>
            <span class="nav-sep">♦</span>
            <a href="/blog/" data-en="Blog" data-pt="Blog">Blog</a>
            <span class="nav-sep">♦</span>
            <a href="/research/" data-en="Research" data-pt="Pesquisa">Research</a>
            <span class="nav-sep">♦</span>
            <a href="/blog/about/" data-en="About" data-pt="Sobre">About</a>
            <span class="nav-sep">♦</span>
            <a href="/tags/" data-en="Tags" data-pt="Categorias">Tags</a>
          </span>
        </nav>
      </header>

      <main class="site-main">
        {% block content %}{% endblock content %}
      </main>

      <footer class="site-footer">
        <p>
        © <span id="roman-year"></span> — <a href="/blog/rss.xml">Scriptorium de
          Gabriel.</a>
        </p>
      </footer>
    </div>

      function applySwordCursor() {
        const pen = swordCursor();
        ['a', 'button', '#theme-toggle', '#back-to-top'].forEach(sel => {
          document.querySelectorAll(sel).forEach(el => {
            el.style.cursor = pen;
          });
        });
        document.body.style.cursor = pen;

    <script>
      (function () {
        var body = document.body;
        var docEl = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var dark = !body.classList.contains('dark-mode');
          body.classList.toggle('dark-mode', dark);
          docEl.classList.toggle('dark-mode', dark);
          localStorage.setItem('newspaper-theme', dark ? 'dark' : 'light');
          if (window.applySwordCursor) window.applySwordCursor();
        });
      })();
    </script>
    <script>
      (function () {
        if (window.applySwordCursor) window.applySwordCursor();
      })();
    </script>
    <script>
      (function () {
        var languageCycle = document.getElementById('language-toggle');
        if (!languageCycle) return;
        var elements = document.querySelectorAll('[data-en]');
        var isEnglish = (localStorage.getItem('newspaper-lang') || 'en') !== 'pt';
        var FLAG_US = '<svg class="flag-icon" id="language-flag" viewBox="0 0 30 20" width="27" height="18" aria-hidden="true">' +
          '<rect width="30" height="20" fill="#fff"></rect>' +
          '<g fill="#b22234">' +
          '<rect y="0" width="30" height="1.54"/><rect y="3.08" width="30" height="1.54"/>' +
          '<rect y="6.15" width="30" height="1.54"/><rect y="9.23" width="30" height="1.54"/>' +
          '<rect y="12.31" width="30" height="1.54"/><rect y="15.38" width="30" height="1.54"/>' +
          '<rect y="18.46" width="30" height="1.54"/>' +
          '</g><rect width="12" height="10.78" fill="#3c3b6e"></rect>' +
          '<g fill="#fff">' +
          '<circle cx="1.6" cy="1.35" r="0.55"/><circle cx="4.1" cy="1.35" r="0.55"/><circle cx="6.6" cy="1.35" r="0.55"/><circle cx="9.1" cy="1.35" r="0.55"/><circle cx="11.6" cy="1.35" r="0.55"/>' +
          '<circle cx="2.85" cy="4.05" r="0.55"/><circle cx="5.35" cy="4.05" r="0.55"/><circle cx="7.85" cy="4.05" r="0.55"/><circle cx="10.35" cy="4.05" r="0.55"/>' +
          '<circle cx="1.6" cy="6.75" r="0.55"/><circle cx="4.1" cy="6.75" r="0.55"/><circle cx="6.6" cy="6.75" r="0.55"/><circle cx="9.1" cy="6.75" r="0.55"/><circle cx="11.6" cy="6.75" r="0.55"/>' +
          '<circle cx="2.85" cy="9.45" r="0.55"/><circle cx="5.35" cy="9.45" r="0.55"/><circle cx="7.85" cy="9.45" r="0.55"/><circle cx="10.35" cy="9.45" r="0.55"/>' +
          '</g></svg>';
        var FLAG_BR = '<svg class="flag-icon" id="language-flag" viewBox="0 0 30 20" width="27" height="18" aria-hidden="true">' +
          '<rect width="30" height="20" fill="#009c3b"></rect>' +
          '<polygon points="15,1 29,10 15,19 1,10" fill="#ffdf00"></polygon>' +
          '<circle cx="15" cy="10" r="6.5" fill="#002776"></circle>' +
          '<path d="M8.8 9 Q15 11.6 21.2 9 L21.2 11.6 Q15 14.2 8.8 11.6 Z" fill="#fff"></path>' +
          '<circle cx="10" cy="7.6" r="0.6" fill="#fff"></circle>' +
          '<circle cx="20" cy="7.6" r="0.6" fill="#fff"></circle>' +
          '<circle cx="13" cy="5.9" r="0.6" fill="#fff"></circle>' +
          '<circle cx="17" cy="13.5" r="0.6" fill="#fff"></circle>' +
          '<circle cx="14.5" cy="14.5" r="0.6" fill="#fff"></circle>' +
          '</svg>';

        function applyLanguage() {
          elements.forEach(function (el) {
            var temp = el.innerHTML;
            el.innerHTML = el.getAttribute(isEnglish ? 'data-en' : 'data-pt');
            el.setAttribute(isEnglish ? 'data-pt' : 'data-en', temp);
          });
        }

        function setFlag() {
          var flag = document.getElementById('language-flag');
          if (flag) flag.outerHTML = isEnglish ? FLAG_BR : FLAG_US;
        }

        setFlag();
        if (!isEnglish) {
          applyLanguage();
        }

        languageCycle.addEventListener('click', function () {
          isEnglish = !isEnglish;
          localStorage.setItem('newspaper-lang', isEnglish ? 'en' : 'pt');
          setFlag();
          applyLanguage();
          if (window.applySwordCursor) window.applySwordCursor();
        });
      })();
    </script>
    <script>
      (function () {
        var topBtn = document.getElementById('back-to-top');
        if (!topBtn) return;
        topBtn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        var THRESHOLD = 1000;
        function toggle() {
          topBtn.hidden = (window.scrollY || document.documentElement.scrollTop) < THRESHOLD;
        }
        toggle();
        window.addEventListener('scroll', toggle, { passive: true });
      })();
    </script>
