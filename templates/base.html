<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{{ config.description }}">
    <link rel="icon" href="{{ get_url(path='blog/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ get_url(path='blog/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ get_url(path='blog/favicon-16x16.png') }}">
    <link rel="stylesheet" href="{{ get_url(path='blog/blog.css') }}">
    {% if config.generate_feed %}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='blog/rss.xml', trailing_slash=false) }}">
    {% endif %}

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Eczar:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime&family=Noto+Sans+Symbols:wght@400&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap"
      rel="stylesheet">

    <!-- THEME (follows the portfolio's persisted newspaper-theme preference) -->
    <script>
      (function () {
        var theme = localStorage.getItem('newspaper-theme')
          || localStorage.getItem('theme')
          || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark-mode');
          if (document.body) document.body.classList.add('dark-mode');
        }
      })();
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
          ignoreHtmlClass: "tex2jax_ignore"
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
  </head>
  <body>
    <div class="blog-controls">
      {% if page and "posts" in page.components %}
      <div class="mode-seal" id="BackToTop" title="Back to top" hidden>
        <span class="seal-icon">🢁</span>
      </div>
      {% endif %}
      <div class="mode-seal" id="ModeToggle" title="Change theme">
        <span class="seal-icon">✦</span>
      </div>
    </div>
    <header class="site-header">
      <nav class="site-nav">
        <a class="site-title" href="{{ get_url(path='/blog/') }}">blog.</a>
        <span class="nav-links">
          <a href="/">home</a>
          <a href="{{ get_url(path='/blog/about/') }}">about</a>
          <a href="{{ get_url(path='/tags/') }}">tags</a>
        </span>
      </nav>
    </header>

    <main class="site-main">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <p>© {{ now() | date(format="%Y") }} {{ config.extra.author }} · <a href="{{ get_url(path='blog/rss.xml', trailing_slash=false) }}">rss</a></p>
    </footer>

    <script>
      (function () {
        var body = document.body;
        var docEl = document.documentElement;
        var btn = document.getElementById('ModeToggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var dark = !body.classList.contains('dark-mode');
          body.classList.toggle('dark-mode', dark);
          docEl.classList.toggle('dark-mode', dark);
          localStorage.setItem('newspaper-theme', dark ? 'dark' : 'light');
        });
      })();
    </script>
    <script>
      (function () {
        var topBtn = document.getElementById('BackToTop');
        if (!topBtn) return;
        topBtn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        var THRESHOLD = 1000;
        function toggle() {
          topBtn.hidden = (window.scrollY || document.documentElement.scrollTop) < THRESHOLD;
        }
        toggle();
        window.addEventListener('scroll', toggle, { passive: true });
      })();
    </script>
  </body>
</html>
