# Zola configuration for the gabrielzschmitz blog. Keep it minimal

base_url = "/blog/"
title = "blog."
description = "This is the gabrielzschmitz blog."
default_language = "en"
generate_feeds = true
feed_filenames = ["rss.xml"]
build_search_index = false
minify_html = true

# Static assets live here (blog/static/) and are copied verbatim to the output.
# Templates live in blog/templates/, styling in blog/static/blog.css.
taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
# Typographic punctuation: `--` -> en dash, `---` -> em dash, curly quotes,
# `...` -> ellipsis.
smart_punctuation = true

# Language-aware syntax highlighting, colors emitted inline (no extra CSS
# file).
[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
# Author info surfaced in the templates.
author = "gabrielzschmitz"
