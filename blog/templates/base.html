<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{{ config.description }}">
    <link rel="icon" href="/blog/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="/blog/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/blog/favicon-32x32.png">
    <link rel="stylesheet" href="{{ get_url(path='blog.css') }}">
    {% if config.generate_feed %}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path='rss.xml', trailing_slash=false) }}">
    {% endif %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
          ignoreHtmlClass: "tex2jax_ignore"
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav">
        <a class="site-title" href="{{ get_url(path='/') }}">{{ config.title }}</a>
        <span class="nav-links">
          <a href="{{ get_url(path='/') }}">home</a>
          <a href="{{ get_url(path='/about/') }}">about</a>
          <a href="{{ get_url(path='/tags/') }}">tags</a>
        </span>
      </nav>
    </header>

    <main class="site-main">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <p>© {{ now() | date(format="%Y") }} {{ config.extra.author }} · <a href="{{ get_url(path='rss.xml', trailing_slash=false) }}">rss</a></p>
    </footer>
  </body>
</html>
